[project]
name = "arm-template-injector"
version = "1.0.0"
description = "Inject external files into JSON templates"
requires-python = ">=3.11"

[project.scripts]
inject = "injector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injector"]